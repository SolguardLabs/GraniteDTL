name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - production
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: ${{ matrix.os }} / Node 24 / C++17
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Configure Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Configure GCC
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes g++
      - name: Install dependencies
        run: npm ci
      - name: Validate protocol
        run: npm run ci
